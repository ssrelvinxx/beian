name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 产物保留 3 天。
      #
      # 默认保留期长达 90 天，而每次 push main 都会传一个 ~18MB 的 debug 包 ——
      # 积到 68 个就把 GitHub 的 500MB 配额撑爆了（收到过配额告警邮件）。
      # debug 包只在「改完立刻验证」时有用，3 天足够，过期自动清掉。
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beian-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3