name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0），留空则用 1.0.0'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # tag 推送时用 tag 名；手动触发时用输入的版本号
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="1.0.0"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version: $V"

      # ── 签名密钥：必须每次都用同一把 ──────────────────────────────────
      #
      # 之前这里是「不存在就现生成一把」：runner 是干净环境，
      # 每次 CI 都会 new 一个全新的 debug.keystore —— 也就是每个版本
      # 签名都不同。Android 不允许签名不同的包覆盖安装，
      # 于是更新下载后一装就报「已安装」/「签名冲突」。
      #
      # 现在把固定的 keystore 以 base64 存在仓库 Secret 里，
      # 每次构建还原同一份，签名才稳定。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "✅ 已还原固定 keystore"
            keytool -list -keystore ~/.android/debug.keystore \
              -storepass "${KEYSTORE_PASSWORD:-android}" 2>/dev/null | grep -i "SHA256" || true
          else
            echo "::warning::未配置 KEYSTORE_BASE64，回退到临时生成 —— 这样出来的包无法覆盖安装"
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        env:
          GIT_TAG: ${{ steps.ver.outputs.version }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PversionName=${{ steps.ver.outputs.version }}

      - name: Prepare artifact
        id: apk
        run: |
          mkdir -p out
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "found: $SRC"
          cp "$SRC" "out/huahua-${{ steps.ver.outputs.version }}.apk"
          ls -la out/
          echo "apk=out/huahua-${{ steps.ver.outputs.version }}.apk" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          files: ${{ steps.apk.outputs.apk }}
          generate_release_notes: true
          prerelease: ${{ github.ref_type != 'tag' }}
          draft: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: huahua-apk
          path: out/*.apk
          if-no-files-found: error
